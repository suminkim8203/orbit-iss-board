name: Verify, collect and deploy ORBIT

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      collect:
        description: '실제 ISS 데이터를 조회해 공개 일별 기록에 저장 (두 날짜 확보 후에는 보존만 함)'
        required: false
        type: boolean
        default: false
  schedule:
    # 09:25 KST. GitHub schedules can be delayed; the actual fetch time is stored.
    - cron: '25 0 * * *'

permissions:
  contents: read

concurrency:
  group: orbit-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      collection_failed: ${{ steps.collect.outcome == 'failure' }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install dependencies
        run: npm ci --prefix app
      - name: Verify official assets
        run: node scripts/verify-assets.mjs
      - name: Test data storage and failure handling
        run: npm test --prefix app
      - name: Check application source
        run: npm run lint --prefix app
      - name: Collect real daily reading
        id: collect
        if: github.event_name == 'schedule' || inputs.collect == true
        continue-on-error: true
        run: node scripts/collect.mjs
      - name: Commit real records or source failure status
        if: github.event_name == 'schedule' || inputs.collect == true
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/public/data/records.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record actual ISS collection outcome'
            git push origin HEAD:main
          fi
      - name: Record source revision
        run: node scripts/build-info.mjs
      - name: Build static website
        run: npm run build --prefix app
      - name: Scan source, deployment files and Git history for secrets
        run: node scripts/scan-secrets.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: app/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified static files
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Report failed collection after publishing last-good records
        if: needs.build.outputs.collection_failed == 'true'
        run: |
          echo 'ISS collection failed. Last-good records and the failure status were preserved and deployed.'
          exit 1
